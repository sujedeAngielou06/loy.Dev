<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech Stack</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 45%, #0f172a 100%);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      max-width: 720px;
      width: 100%;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 2rem 2.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0 0 1.75rem;
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #64748b;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }
    .icons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }
    .icons img {
      height: 48px;
      width: auto;
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.9);
      padding: 6px 8px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .row-skillicons {
      margin-bottom: 1rem;
    }
    .row-skillicons img {
      height: auto;
      max-width: 100%;
      padding: 10px 12px;
    }
    footer {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      font-size: 0.8rem;
      color: #64748b;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <article class="card">
    <h1>Hi, I'm <span style="color:#38bdf8;">Your Name</span> 👋</h1>
    <p class="subtitle">
      HTML, CSS, PHP, Laravel, JavaScript, MySQL — plus design in Figma &amp; Canva.
    </p>

    <p class="label">Tech stack</p>
    <div class="row-skillicons">
      <img
        src="https://skillicons.dev/icons?i=html,css,php,laravel,js,mysql,figma,canva"
        alt="HTML, CSS, PHP, Laravel, JavaScript, MySQL, Figma, Canva"
      />
    </div>

    <p class="label">Links</p>
    <div class="icons">
      <a href="https://github.com/YOUR_USERNAME" target="_blank" rel="noopener noreferrer">
        <img src="https://img.shields.io/badge/GitHub-181717?style=flat-square&logo=github&logoColor=white" alt="GitHub" />
      </a>
      <a href="https://www.linkedin.com/in/YOUR_PROFILE/" target="_blank" rel="noopener noreferrer">
        <img src="https://img.shields.io/badge/LinkedIn-0A66C2?style=flat-square&logo=linkedin&logoColor=white" alt="LinkedIn" />
      </a>
    </div>

    <footer>
      Replace <strong>Your Name</strong>, <strong>YOUR_USERNAME</strong>, and LinkedIn URL. For the live GitHub profile banner, use a root <code>README.md</code> — GitHub does not render <code>README.html</code> on your profile.
    </footer>
  </article>
</body>
</html>
